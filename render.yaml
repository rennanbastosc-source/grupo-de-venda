# Render Blueprint — worker Baileys (long-running)
# Serviço: https://grupo-de-venda-worker.onrender.com
# Padrão frota-impacto: autoDeploy on commit + secrets via dashboard (sync: false).
services:
  - type: web
    name: grupo-de-venda-worker
    env: node
    plan: free
    region: oregon
    numInstances: 1
    rootDir: worker
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: WHATSAPP_SESSION_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: WORKER_API_SECRET
        sync: false
