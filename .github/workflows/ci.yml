name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
  WORKER_BASE_URL: http://127.0.0.1:3100
  WORKER_API_SECRET: ci-placeholder-worker-secret
  CRON_SECRET: ci-placeholder-cron-secret

jobs:
  quality:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (app)
        run: npm ci

      - name: Instalar dependências (worker)
        run: npm ci
        working-directory: worker

      - name: Lint
        run: npm run lint

      - name: TypeScript (app)
        run: npm run typecheck

      - name: TypeScript (worker)
        run: npm run worker:typecheck

      - name: Testes
        run: npm run test

  build:
    name: Build de produção
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (app)
        run: npm ci

      - name: Instalar dependências (worker)
        run: npm ci
        working-directory: worker

      - name: Build Next (smoke local)
        run: npm run build

  security:
    name: Vulnerabilidades críticas
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Auditar dependências de produção (app)
        run: npm audit --omit=dev --audit-level=critical

      - name: Auditar dependências de produção (worker)
        run: npm audit --omit=dev --audit-level=critical
        working-directory: worker

  # Só sobe se quality + build verdes. Auto-deploy Git da Vercel está desligado.
  deploy:
    name: Deploy Vercel (pós-CI)
    needs: [quality, build]
    # forks: não deploy (sem secrets)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull env Vercel
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Configure secrets.VERCEL_TOKEN e vars VERCEL_ORG_ID / VERCEL_PROJECT_ID"
            exit 1
          fi
          ENV_NAME=preview
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV_NAME=production
          fi
          vercel pull --yes --environment="$ENV_NAME" --token="$VERCEL_TOKEN"

      - name: Build na CI (prebuilt)
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

      - name: Deploy prebuilt
        id: deploy
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: URL do deploy
        run: echo "### Deploy ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
